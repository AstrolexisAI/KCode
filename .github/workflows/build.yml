name: Build & Test

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install ripgrep (required by Grep/PreviewGrepReplace tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install
      - name: Install backend workspace deps (hono)
        run: cd backend && bun install
      - name: Dependency audit
        run: bun audit
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # Tests BLOCK the build. They ran advisory from ~v2.10.2xx after
      # flakes stalled releases, but that let a real regression (self-
      # critique ignoring customFetch, 25 E2E tests red) ship unnoticed
      # for 4 months across ~200 versions. The suite was stabilized on
      # 2026-08-28 (hermetic mcp-oauth, calibrated perf threshold); if a
      # test flakes here, fix or quarantine that test — do not flip this
      # step back to advisory.
      - name: Run tests
        run: bun run test:ci

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          # x64 macOS dropped 2026-05-08 — Apple Silicon is the modern
          # target, and macos-13 runners on GHA queue for 30+ min. If
          # Intel Mac support comes back as a real ask, restore the
          # entry: { target: macos-x64, os: macos-13 }.
          - target: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Build binary
        run: |
          mkdir -p release
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            bun build src/index.ts --compile --target=bun-linux-arm64 --minify --outfile release/kcode-${{ matrix.target }}
          else
            bun build src/index.ts --compile --minify --outfile release/kcode-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcode-${{ matrix.target }}
          path: release/kcode-${{ matrix.target }}*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token: write is required for sigstore keyless-OIDC signing.
      # Without this the cosign sign-blob step fails with a 403 on the
      # token mint. See https://docs.sigstore.dev/cosign/openid_signing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/kcode-*; do
            target=$(basename "$dir")
            cp "$dir/$target" "release/$target"
            chmod +x "release/$target"
          done
          ls -la release/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.5.0'

      - name: Sign binaries (sigstore keyless OIDC)
        run: |
          # Keyless signing: identity is the GH Actions workflow itself,
          # signature is anchored in Rekor's transparency log. Anyone
          # can verify with `cosign verify-blob` — no shared secret.
          for f in release/kcode-*; do
            # Skip already-emitted .sig / .pem in case of re-runs
            case "$f" in
              *.sig|*.pem) continue ;;
            esac
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-certificate "${f}.pem" \
              --output-signature "${f}.sig" \
              "$f"
          done
          ls -la release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          # Regenerate after sigs land so the sums file covers everything
          # downstream verifiers may want to check (binaries + sigs + certs).
          sha256sum kcode-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') }}
